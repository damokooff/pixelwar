<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel War × Supabase</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161a22;
    --border: #262c38;
    --text: #e6e8eb;
    --muted: #8b93a3;
    --accent: #6c5ce7;
    --accent-hover: #7d6ef0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a1f2e 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  header {
    width: 100%; max-width: 900px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
  }
  h1 {
    font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(90deg, #6c5ce7, #00cec9, #fd79a8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 span { font-size: 1.3rem; }

  .user-box {
    display: flex; align-items: center; gap: 12px;
    font-size: 0.85rem; color: var(--muted);
  }
  .badge {
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px;
    font-size: 0.8rem; color: var(--text);
    max-width: 220px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  button {
    font-family: inherit; font-size: 0.9rem; font-weight: 600;
    border: none; border-radius: 10px; padding: 10px 18px;
    cursor: pointer; transition: all 0.15s ease;
    background: var(--accent); color: #fff;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.ghost {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted);
  }
  button.ghost:hover:not(:disabled) { background: var(--panel); color: var(--text); }

  #auth-screen {
    width: 100%; max-width: 400px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 18px; padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #auth-screen h2 { font-size: 1.25rem; margin-bottom: 6px; }
  #auth-screen p.sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 22px; }
  .field { margin-bottom: 14px; }
  label {
    display: block; font-size: 0.78rem; font-weight: 600;
    color: var(--muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="email"], input[type="password"] {
    width: 100%; padding: 12px 14px;
    background: #0f1219; border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-size: 0.95rem; font-family: inherit;
    outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  .auth-actions { display: flex; gap: 10px; margin-top: 20px; }
  .auth-actions button { flex: 1; }
  .msg {
    margin-top: 16px; font-size: 0.85rem;
    padding: 10px 14px; border-radius: 10px; display: none;
  }
  .msg.error { display: block; background: rgba(231,76,60,0.12); color: #ff8b7d; border: 1px solid rgba(231,76,60,0.3); }
  .msg.ok    { display: block; background: rgba(46,204,113,0.12); color: #6ee7a8; border: 1px solid rgba(46,204,113,0.3); }

  #game-screen {
    display: none; width: 100%; max-width: 900px;
    flex-direction: column; align-items: center; gap: 20px;
  }
  .board-wrap {
    position: relative; background: var(--panel);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    max-width: 100%;
  }
  canvas {
    display: block; width: 100%; max-width: 640px; height: auto;
    aspect-ratio: 1 / 1; border-radius: 8px;
    cursor: crosshair; image-rendering: pixelated;
    touch-action: manipulation;
  }
  .hud {
    display: flex; align-items: center; gap: 24px;
    flex-wrap: wrap; justify-content: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 22px;
    width: 100%; max-width: 668px;
  }
  .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 7px;
    cursor: pointer; border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; transform: scale(1.15); }

  .stock-box { flex: 1; min-width: 220px; }
  .stock-line {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.8rem; color: var(--muted); margin-bottom: 6px;
  }
  .stock-line .big {
    font-size: 0.95rem; font-weight: 700; color: var(--text);
  }
  .stock-line .big.low { color: #ff8b7d; }
  .level-tag {
    background: linear-gradient(90deg, #6c5ce7, #00cec9);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; font-weight: 700;
  }
  .bar {
    height: 10px; background: #0f1219; border-radius: 999px;
    overflow: hidden; border: 1px solid var(--border);
    position: relative;
  }
  .bar-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #6c5ce7, #00cec9);
    border-radius: 999px;
    transition: width 0.15s linear;
  }
  .bar-fill.low { background: linear-gradient(90deg, #e74c3c, #f39c12); }
  .stock-hint {
    font-size: 0.72rem; color: var(--muted);
    margin-top: 6px; display: flex; justify-content: space-between;
  }

  .info { font-size: 0.8rem; color: var(--muted); text-align: center; }
  .info b { color: var(--text); }

  /* ---- Barre de reset ---- */
  .reset-bar {
    display: none;
    align-items: center;
    gap: 12px;
    background: rgba(231,76,60,0.08);
    border: 1px solid rgba(231,76,60,0.35);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 0.85rem;
    color: #ff8b7d;
    width: 100%;
    max-width: 668px;
  }
  .reset-icon { font-size: 1.1rem; }
  .reset-bar .bar {
    flex: 1;
    height: 6px;
    background: #0f1219;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .reset-bar .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e74c3c, #f39c12);
    border-radius: 999px;
    transition: width 0.3s linear;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: #1a1f2e; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 20px;
    font-size: 0.88rem; color: var(--text);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.good { border-color: rgba(46,204,113,0.5); }
  .toast.warn { border-color: rgba(243,156,18,0.5); }

  @media (max-width: 620px) {
    h1 { font-size: 1.25rem; }
    .hud { padding: 12px; gap: 14px; }
    .swatch { width: 22px; height: 22px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎨 Pixel War <span>× Supabase</span></h1>
  <div class="user-box" id="user-box" style="display:none">
    <span class="badge" id="user-email"></span>
    <button class="ghost" id="logout-btn">Déconnexion</button>
  </div>
</header>

<section id="auth-screen">
  <h2>Connexion</h2>
  <p class="sub">Connecte-toi pour poser ton premier pixel.</p>
  <form id="auth-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="toi@exemple.com" required>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" minlength="6" required>
    </div>
    <div class="auth-actions">
      <button type="submit" id="login-btn">Se connecter</button>
      <button type="button" class="ghost" id="signup-btn">Créer un compte</button>
    </div>
  </form>
  <div class="msg" id="auth-msg"></div>
</section>

<section id="game-screen">
  <div class="board-wrap"><canvas id="canvas"></canvas></div>

  <div class="hud">
    <div class="palette" id="palette"></div>

    <div class="stock-box">
      <div class="stock-line">
        <span class="big" id="stock-text">⚡ 3 / 3</span>
        <span class="level-tag" id="level-tag">Niveau 1</span>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="stock-hint">
        <span id="regen-hint">+1 pixel / 2s</span>
        <span id="total-hint">0 pixel posé</span>
      </div>
    </div>
  </div>

  <div class="info">
    Grille <b id="grid-size"></b> · <b id="pixel-count">0</b> pixels sur la toile · Clique ou <b>Espace</b> pour dessiner
  </div>

  <div class="reset-bar" id="reset-bar">
    <span class="reset-icon">🌊</span>
    <span id="reset-text">Reset en cours…</span>
    <div class="bar"><div class="bar-fill" id="reset-fill"></div></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   ⚙️ REMPLACE CES 2 LIGNES PAR TES CLÉS SUPABASE
   ========================================================= */
const SUPABASE_URL      = "https://tofjkfemtynxeiklblby.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvZmprZmVtdHlueGVpa2xibGJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NTQ5OTMsImV4cCI6MjEwNjMzMDk5M30.0ghMra28vMfyznSzOPQg67BygYJbsQk_X70VSmlzOSc";

/* =========================================================
   🎮 CONSTANTES DU JEU
   ========================================================= */
const GRID     = 64;
const CELL     = 10;

const BASE_STOCK       = 3;
const MAX_STOCK        = 999;
const STOCK_PER_LEVEL  = 5;
const REGEN_MS         = 1000;

const COLORS = [
  "#ffffff","#c0c0c0","#808080","#404040","#000000",
  "#e74c3c","#ff7675","#e17055","#fdcb6e","#ffeaa7",
  "#00b894","#55efc4","#00cec9","#74b9ff","#0984e3",
  "#6c5ce7","#a29bfe","#fd79a8","#e84393","#b2bec3",
  "#8e44ad","#2d3436","#d63031","#f39c12"
];

/* =========================================================
   🛡️ VÉRIF CONFIG
   ========================================================= */
if (SUPABASE_URL.includes("xxxxx")) {
  document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#e6e8eb">' +
    '<h2>⚠️ Configure tes clés Supabase dans le fichier</h2></div>';
  throw new Error("Config manquante");
}

const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   🖼️ DOM
   ========================================================= */
const authScreen  = document.getElementById("auth-screen");
const gameScreen  = document.getElementById("game-screen");
const userBox     = document.getElementById("user-box");
const userEmail   = document.getElementById("user-email");
const authForm    = document.getElementById("auth-form");
const authMsg     = document.getElementById("auth-msg");
const loginBtn    = document.getElementById("login-btn");
const signupBtn   = document.getElementById("signup-btn");
const logoutBtn   = document.getElementById("logout-btn");
const canvas      = document.getElementById("canvas");
const ctx         = canvas.getContext("2d");
const paletteEl   = document.getElementById("palette");
const barFill     = document.getElementById("bar-fill");
const stockText   = document.getElementById("stock-text");
const levelTag    = document.getElementById("level-tag");
const regenHint   = document.getElementById("regen-hint");
const totalHint   = document.getElementById("total-hint");
const pixelCount  = document.getElementById("pixel-count");
const toastEl     = document.getElementById("toast");

/* =========================================================
   💾 ÉTAT
   ========================================================= */
let currentUser   = null;
let pixelMap      = new Map();
let channel       = null;
let selectedColor = COLORS[5];
let hover         = null;

/* Stock */
let totalPlaced  = 0;
let maxStock     = BASE_STOCK;
let stock        = BASE_STOCK;
let lastRegenAt  = Date.now();

/* Espace / placement continu */
let spaceHeld   = false;
let spaceTimer  = null;
let placing     = false;

/* Reset auto */
let resetLoopTimer = null;
let resetInfo      = { total: 0, pending: 0, capacity: 4096 };

/* Timers globaux */
let stockTimer = null;

canvas.width  = GRID * CELL;
canvas.height = GRID * CELL;
document.getElementById("grid-size").textContent = `${GRID}×${GRID}`;

/* =========================================================
   📊 PROGRESSION
   ========================================================= */
function computeMaxStock(total) {
  return Math.min(MAX_STOCK, BASE_STOCK + Math.floor(total / STOCK_PER_LEVEL));
}
function computeLevel(total) {
  return Math.floor(total / STOCK_PER_LEVEL) + 1;
}

/* =========================================================
   🖌️ RENDU
   ========================================================= */
function drawAll() {
  ctx.fillStyle = "#0f1219";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const [key, color] of pixelMap) {
    const i = key.indexOf(",");
    const x = +key.slice(0, i);
    const y = +key.slice(i + 1);
    ctx.fillStyle = color;
    ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  }

  ctx.strokeStyle = "rgba(255,255,255,0.055)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= GRID; i++) {
    const p = i * CELL + 0.5;
    ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height);
    ctx.moveTo(0, p); ctx.lineTo(canvas.width, p);
  }
  ctx.stroke();

  if (hover) {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(hover.x * CELL + 1, hover.y * CELL + 1, CELL - 2, CELL - 2);
  }
}

function setPixel(x, y, color) {
  pixelMap.set(`${x},${y}`, color);
  pixelCount.textContent = pixelMap.size;
}

/* =========================================================
   ⚡ STOCK
   ========================================================= */
function regenTick() {
  const now = Date.now();
  if (stock >= maxStock) { lastRegenAt = now; return; }

  const elapsed = now - lastRegenAt;
  const gained  = Math.floor(elapsed / REGEN_MS);

  if (gained > 0) {
    stock = Math.min(maxStock, stock + gained);
    lastRegenAt += gained * REGEN_MS;
    renderHud();
  }
}

function consumeStock() {
  if (stock < 1) return false;
  const wasFull = stock >= maxStock;
  stock -= 1;
  if (wasFull) lastRegenAt = Date.now();
  renderHud();
  return true;
}

function renderHud() {
  const pct = maxStock > 0 ? (stock / maxStock) * 100 : 0;
  barFill.style.width = pct + "%";
  barFill.classList.toggle("low", stock <= 1);

  stockText.classList.remove("low");
  if (stock <= 0) {
    stockText.textContent = "🪫 0 / " + maxStock;
    stockText.classList.add("low");
  } else {
    stockText.textContent = "⚡ " + stock + " / " + maxStock;
  }

  levelTag.textContent = "Niveau " + computeLevel(totalPlaced);

  regenHint.textContent = stock >= maxStock
    ? "Stock plein"
    : `+1 pixel / 2s · prochain +1 dans ${Math.ceil((REGEN_MS - (Date.now() - lastRegenAt)) / 100) / 10}s`;

  totalHint.textContent = totalPlaced + " pixel" + (totalPlaced > 1 ? "s" : "") + " posé" + (totalPlaced > 1 ? "s" : "");

  canvas.style.cursor = stock > 0 ? "crosshair" : "not-allowed";
}

/* =========================================================
   🔐 AUTH
   ========================================================= */
function showMsg(text, type = "error") {
  authMsg.textContent = text;
  authMsg.className = "msg " + type;
}
function clearMsg() {
  authMsg.className = "msg";
  authMsg.textContent = "";
}

authForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  loginBtn.disabled = signupBtn.disabled = true;
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) showMsg("❌ " + traduireErreur(error.message));
  loginBtn.disabled = signupBtn.disabled = false;
});

signupBtn.addEventListener("click", async () => {
  clearMsg();
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || password.length < 6) {
    showMsg("Renseigne un email valide et un mot de passe de 6 caractères minimum.");
    return;
  }
  loginBtn.disabled = signupBtn.disabled = true;
  const { data, error } = await db.auth.signUp({ email, password });
  loginBtn.disabled = signupBtn.disabled = false;
  if (error) { showMsg("❌ " + traduireErreur(error.message)); return; }
  if (data.user && !data.session) {
    showMsg("✅ Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse.", "ok");
  } else {
    showMsg("✅ Compte créé, connexion en cours…", "ok");
  }
});

logoutBtn.addEventListener("click", async () => { await db.auth.signOut(); });

function traduireErreur(msg) {
  if (/Invalid login credentials/i.test(msg)) return "Email ou mot de passe incorrect.";
  if (/Email not confirmed/i.test(msg))       return "Confirme ton email avant de te connecter.";
  if (/User already registered/i.test(msg))   return "Cet email est déjà utilisé.";
  if (/Password should be/i.test(msg))        return "Mot de passe trop court (6 caractères min).";
  if (/rate limit/i.test(msg))                return "Trop de tentatives, réessaie dans un instant.";
  return msg;
}

/* =========================================================
   🔄 SESSION
   ========================================================= */
db.auth.onAuthStateChange((_event, session) => {
  const user = session?.user ?? null;
  if (user && user.id !== currentUser?.id) {
    currentUser = user;
    enterGame(user);
  } else if (!user) {
    currentUser = null;
    leaveGame();
  }
});

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    enterGame(session.user);
  }
})();

async function enterGame(user) {
  authScreen.style.display = "none";
  gameScreen.style.display = "flex";
  userBox.style.display    = "flex";
  userEmail.textContent    = user.email;

  buildPalette();

  await loadProfile(user);
  await loadPixels();
  subscribeRealtime();
  startStockLoop();
  startResetLoop();

  renderHud();
  drawAll();
}

function leaveGame() {
  authScreen.style.display = "block";
  gameScreen.style.display = "none";
  userBox.style.display    = "none";

  if (channel)         { db.removeChannel(channel); channel = null; }
  if (stockTimer)      { clearInterval(stockTimer);      stockTimer = null; }
  if (resetLoopTimer)  { clearInterval(resetLoopTimer);  resetLoopTimer = null; }
  if (spaceTimer)      { clearInterval(spaceTimer);      spaceTimer = null; }

  spaceHeld = false;
  placing   = false;

  pixelMap.clear();
  hover = null;
  drawAll();

  document.getElementById("reset-bar").style.display = "none";

  authForm.reset();
  clearMsg();
  loginBtn.disabled = signupBtn.disabled = false;
}

/* =========================================================
   👤 PROFIL
   ========================================================= */
async function loadProfile(user) {
  let { data, error } = await db
    .from("profiles")
    .select("total_placed")
    .eq("id", user.id)
    .maybeSingle();

  if (error || !data) {
    const ins = await db
      .from("profiles")
      .insert({ id: user.id, email: user.email, total_placed: 0 })
      .select("total_placed")
      .maybeSingle();
    data = ins.data || { total_placed: 0 };
  }

  totalPlaced = data.total_placed || 0;
  maxStock    = computeMaxStock(totalPlaced);
  stock       = maxStock;
  lastRegenAt = Date.now();
}

/* =========================================================
   📥 CHARGEMENT
   ========================================================= */
async function loadPixels() {
  pixelMap.clear();
  const STEP = 1000;
  let from = 0;

  while (true) {
    const { data, error } = await db
      .from("pixels")
      .select("x,y,color")
      .range(from, from + STEP - 1);

    if (error) { console.error("Erreur chargement :", error); break; }
    for (const p of data) setPixel(p.x, p.y, p.color);
    if (data.length < STEP) break;
    from += STEP;
  }
  drawAll();
}

/* =========================================================
   📡 TEMPS RÉEL (INSERT/UPDATE + DELETE)
   ========================================================= */
function subscribeRealtime() {
  if (channel) db.removeChannel(channel);

  channel = db
    .channel("public:pixels")
    .on(
      "postgres_changes",
      { event: "*", schema: "public", table: "pixels" },
      (payload) => {
        /* DELETE : pixel supprimé par le reset */
        if (payload.eventType === "DELETE") {
          const old = payload.old;
          if (old && old.x != null && old.y != null) {
            pixelMap.delete(`${old.x},${old.y}`);
            pixelCount.textContent = pixelMap.size;
            drawAll();
          }
          return;
        }

        /* INSERT / UPDATE */
        const p = payload.new;
        if (!p || p.x == null) return;
        setPixel(p.x, p.y, p.color);
        drawAll();
      }
    )
    .subscribe();
}

/* =========================================================
   🎨 PALETTE
   ========================================================= */
function buildPalette() {
  paletteEl.innerHTML = "";
  COLORS.forEach((c) => {
    const sw = document.createElement("div");
    sw.className = "swatch" + (c === selectedColor ? " active" : "");
    sw.style.background = c;
    sw.title = c;
    sw.addEventListener("click", () => {
      selectedColor = c;
      document.querySelectorAll(".swatch").forEach(el => el.classList.remove("active"));
      sw.classList.add("active");
    });
    paletteEl.appendChild(sw);
  });
}

/* =========================================================
   🖱️ INTERACTION
   ========================================================= */
function canvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = Math.floor(((e.clientX - rect.left) * scaleX) / CELL);
  const y = Math.floor(((e.clientY - rect.top)  * scaleY) / CELL);
  if (x < 0 || y < 0 || x >= GRID || y >= GRID) return null;
  return { x, y };
}

canvas.addEventListener("mousemove", (e) => {
  const c = canvasCoords(e);
  const changed = (!!c !== !!hover) || (c && hover && (c.x !== hover.x || c.y !== hover.y));
  hover = c;
  if (changed) drawAll();
});

canvas.addEventListener("mouseleave", () => {
  hover = null;
  drawAll();
});

canvas.addEventListener("click", async (e) => {
  const c = canvasCoords(e);
  if (!c) return;
  await placePixel(c.x, c.y);
});

canvas.addEventListener("touchstart", async (e) => {
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = Math.floor(((touch.clientX - rect.left) * scaleX) / CELL);
  const y = Math.floor(((touch.clientY - rect.top)  * scaleY) / CELL);
  if (x < 0 || y < 0 || x >= GRID || y >= GRID) return;
  await placePixel(x, y);
}, { passive: true });

/* =========================================================
   ⌨️ ESPACE = POSER / MAINTENIR = PEINDRE EN CONTINU
   ========================================================= */
function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || el.isContentEditable;
}

function spacePlace() {
  if (!hover) return;
  if (stock < 1) return;
  const key = `${hover.x},${hover.y}`;
  if (pixelMap.get(key) === selectedColor) return;
  placePixel(hover.x, hover.y);
}

document.addEventListener("keydown", (e) => {
  if (e.code !== "Space") return;
  if (isTypingTarget(e.target)) return;
  e.preventDefault();
  if (spaceHeld) return;
  spaceHeld = true;
  spacePlace();
  spaceTimer = setInterval(spacePlace, 250);
});

document.addEventListener("keyup", (e) => {
  if (e.code !== "Space") return;
  if (isTypingTarget(e.target)) return;
  e.preventDefault();
  spaceHeld = false;
  if (spaceTimer) { clearInterval(spaceTimer); spaceTimer = null; }
});

window.addEventListener("blur", () => {
  spaceHeld = false;
  if (spaceTimer) { clearInterval(spaceTimer); spaceTimer = null; }
});

/* =========================================================
   ✏️ POSER UN PIXEL
   ========================================================= */
async function placePixel(x, y) {
  if (!currentUser) return;
  if (placing) return;

  const key = `${x},${y}`;
  if (pixelMap.get(key) === selectedColor) return;

  regenTick();

  if (stock < 1) {
    showToast("🪫 Plus de pixels en stock, attends la recharge…", "warn");
    return;
  }

  placing = true;
  consumeStock();

  setPixel(x, y, selectedColor);
  drawAll();

  try {
    const { data, error } = await db.rpc("place_pixel", {
      px: x, py: y, pcolor: selectedColor
    });

    if (error) {
      console.error("❌ place_pixel :", error);
      showToast("❌ Impossible de poser le pixel", "warn");
      await loadPixels();
      stock = Math.min(maxStock, stock + 1);
      renderHud();
      return;
    }

    if (typeof data === "number" && data >= 0) {
      const oldMax = maxStock;
      totalPlaced = data;
      maxStock = computeMaxStock(totalPlaced);

      if (maxStock > oldMax) {
        stock = Math.min(maxStock, stock + 1);
        showToast(`🎉 Niveau ${computeLevel(totalPlaced)} ! Stock max ${maxStock}`, "good");
      }
      renderHud();
    }
  } finally {
    placing = false;
  }
}

/* =========================================================
   ⏱️ BOUCLE DE RECHARGE
   ========================================================= */
function startStockLoop() {
  if (stockTimer) clearInterval(stockTimer);
  stockTimer = setInterval(() => {
    regenTick();
    if (stock < maxStock) renderHud();
  }, 200);
}

/* =========================================================
   🌊 BOUCLE DE RESET AUTOMATIQUE
   ========================================================= */
function updateResetUI(status) {
  resetInfo = status || resetInfo;
  const bar  = document.getElementById("reset-bar");
  const fill = document.getElementById("reset-fill");
  const txt  = document.getElementById("reset-text");

  if (!resetInfo.pending || resetInfo.pending === 0) {
    bar.style.display = "none";
    return;
  }

  bar.style.display = "flex";
  const done = resetInfo.capacity - resetInfo.pending;
  const pct  = (done / resetInfo.capacity) * 100;
  fill.style.width = pct + "%";
  txt.textContent  = `Reset en cours — ${done} / ${resetInfo.capacity} pixels disparus`;
}

function startResetLoop() {
  if (resetLoopTimer) clearInterval(resetLoopTimer);

  resetLoopTimer = setInterval(async () => {
    try {
      /* 1. Si la map est pleine, démarre le reset (idempotent) */
      if (pixelMap.size >= GRID * GRID) {
        const { data } = await db.rpc("start_board_reset");
        if (data === true) {
          showToast("🌊 La map est pleine ! Reset sur 24h lancé…", "warn");
        }
      }

      /* 2. Purge les pixels expirés */
      await db.rpc("cleanup_expired_pixels");

      /* 3. Rafraîchit l'indicateur UI */
      const { data: status } = await db.rpc("reset_status");
      if (status) updateResetUI(status);

    } catch (e) {
      console.warn("Reset loop :", e);
    }
  }, 20);
}

window.addEventListener("beforeunload", () => {
  if (resetLoopTimer) clearInterval(resetLoopTimer);
  if (stockTimer)     clearInterval(stockTimer);
  if (spaceTimer)     clearInterval(spaceTimer);
});

/* =========================================================
   💬 TOAST
   ========================================================= */
let toastTimer;
function showToast(msg, type = "") {
  toastEl.textContent = msg;
  toastEl.className = "toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
}

/* Premier rendu */
drawAll();
</script>
